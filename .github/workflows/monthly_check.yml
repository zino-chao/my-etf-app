name: Daily ETF Check (Mon-Fri 10:05 & 13:05)

on:
  repository_dispatch:
    types: [daily_check] # 接收來自 cron-job.org 的 daily_check 觸發指令
  workflow_dispatch:      # 保留 GitHub UI 上的手動測試按鈕

jobs:
  run-check:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Taipei' # 確保執行環境時區為台灣時間
    steps:
      - name: 下載專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: 執行每日檢核與發送 Telegram 提醒
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python monthly_check.py
