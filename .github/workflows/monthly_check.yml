name: Daily ETF Check (Mon-Fri 10:00 & 13:00)

on:
  schedule:
    # 台灣時間週一至週五 每日 10:00 與 13:00 自動執行 (UTC 02:00 與 05:00)
    - cron: '0 2,5 * * 1-5'
  workflow_dispatch: # 保留手動點擊觸發按鈕，隨時可測試

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: pip install requests pandas

      - name: 執行每日檢核與發送 Telegram 提醒
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python monthly_check.py
